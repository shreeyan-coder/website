<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing Portfolio</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Basic styles for the portfolio */
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background: url('hero-background.jpg') no-repeat center center/cover; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }
        nav { position: absolute; top: 20px; left: 20px; }
        nav a { color: white; margin: 0 15px; text-decoration: none; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; margin: 20px; }
        .gallery img { width: 100%; height: auto; animation: fadeIn 1s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .about, .contact { padding: 20px; background-color: #f9f9f9; margin: 20px; }
        form { display: flex; flex-direction: column; }
        input, textarea { margin: 10px 0; padding: 10px; }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="#about">About</a>
            <a href="#gallery">Gallery</a>
            <a href="#contact">Contact</a>
        </nav>
        <h1>Welcome to My Portfolio</h1>
        <p>Explore my drawings and art projects here!</p>
    </header>
    <section id="about" class="about">
        <h2>About Me</h2>
        <p>I'm a passionate artist specializing in drawing and illustrations. I love to create art that tells a story.</p>
    </section>
    <section id="gallery">
        <h2>Gallery</h2>
        <div class="gallery">
            <img src="art1.jpg" alt="Art 1">
            <img src="art2.jpg" alt="Art 2">
            <img src="art3.jpg" alt="Art 3">
            <img src="art4.jpg" alt="Art 4">
            <!-- Add more artwork as necessary -->
        </div>
    </section>
    <section id="contact" class="contact">
        <h2>Contact Me</h2>
        <form action="#" method="post">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <textarea name="message" rows="4" placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </section>
</body>
</html>
